name: Promotional Deployment

on:
  workflow_dispatch:
    inputs:
      isMandatoryUpdate:
        description: 'Is this a mandatory update?'
        required: true
        type: boolean
        default: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-artifact

      - name: Deploy
        run: |
          echo "Deploying to Staging. Mandatory: ${{ inputs.isMandatoryUpdate }}"

  deploy-preprod:
    name: Deploy to Pre-Prod
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-artifact

      - name: Deploy
        run: echo "Deploying to Pre-Prod..."

  deploy-prod:
    name: Deploy to Production
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-artifact

      - name: Final Deploy
        run: |
          echo "Deploying to Production"
          if [ "${{ inputs.isMandatoryUpdate }}" = "true" ]; then
            echo "Executing high-priority migration scripts..."
          fi
