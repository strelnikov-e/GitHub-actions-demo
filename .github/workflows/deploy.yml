name: Deploy

env:
  INSTALLER_PRODUCT_NAME: Straumann-SIRIOS

on:
  workflow_dispatch:
    inputs:
      deployEnvironment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [ dev, test, staging ]
      mandatory:
        description: 'Mandatory version'
        default: false
        type: boolean
      version:
        description: 'Type version to deploy in format: X.X.X.X'
        required: true
        type: string

jobs:
  non-prod-deploy:
    name: Deploy to ${{ github.event.inputs.deployEnvironment }}
    if: |
      github.event.inputs.deployEnvironment == 'dev' || 
      github.event.inputs.deployEnvironment == 'test'
    runs-on: 'ubuntu-latest'
    environment: ${{ github.event.inputs.deployEnvironment }}
    permissions:
      contents: read

    steps:
      - name: Parse and Validate Version
        id: installer-file-name
        run: |
          RAW_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION=$(echo "$RAW_VERSION" | xargs)

          SEMVER_REGEX="^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$"

          if [[ ! $CLEAN_VERSION =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid version format: $CLEAN_VERSION. Expected X.X.X.X"
            exit 1
          fi

          INSTALLER_FILE_NAME=${INSTALLER_PRODUCT_NAME}-${CLEAN_VERSION}.exe

          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "INSTALLER_FILE_NAME=${INSTALLER_FILE_NAME}" >> $GITHUB_ENV
          echo "Installer to deploy: $INSTALLER_FILE_NAME"
          echo "environment? ${{ github.event.inputs.deployEnvironment }}"
          echo "Is mandatory? ${{ github.event.inputs.mandatory }}"

  staging:
    name: Deploy to staging
    runs-on: 'ubuntu-latest'
    environment: staging
    permissions:
      contents: read
    outputs:
      installer-file-name: ${{ steps.installer-file-name.outputs.INSTALLER_FILE_NAME }}
      installer-version: ${{ steps.installer-file-name.outputs.VERSION }}

    steps:
      - name: Parse and Validate Version
        id: installer-file-name
        run: |
          RAW_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION=$(echo "$RAW_VERSION" | xargs)

          SEMVER_REGEX="^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$"

          if [[ ! $CLEAN_VERSION =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid version format: $CLEAN_VERSION. Expected X.X.X.X"
            exit 1
          fi

          INSTALLER_FILE_NAME=${INSTALLER_PRODUCT_NAME}-${CLEAN_VERSION}.exe

          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "INSTALLER_FILE_NAME=${INSTALLER_FILE_NAME}" >> $GITHUB_ENV
          echo "Installer to deploy: $INSTALLER_FILE_NAME"
          echo "environment? ${{ github.event.inputs.deployEnvironment }}"
          echo "Is mandatory? ${{ github.event.inputs.mandatory }}"

  release-candidate:
    name: Release candidate
    needs: staging
    runs-on: 'ubuntu-latest'
    environment: pre-prod
    env:
      INSTALLER_FILE_NAME: ${{ needs.staging.outputs.installer-file-name }}
    outputs:
      installer-file-name: ${{ needs.staging.outputs.installer-file-name }}
      installer-version: ${{ needs.staging.outputs.installer-version }}

    steps:
      - name: Download artifact
        env:
          RETRY_COUNT: 3
        run: |
          echo "Successfully downloaded ${{ env.INSTALLER_FILE_NAME }}"
          echo "Successfully downloaded version ${{ needs.staging.outputs.installer-version }}"

  release:
    name: Release
    needs: release-candidate
    runs-on: 'ubuntu-latest'
    environment: prod
    env:
      INSTALLER_FILE_NAME: ${{ needs.release-candidate.outputs.installer-file-name }}

    steps:
      - name: Download artifact
        env:
          RETRY_COUNT: 3
        run: |
          echo "Successfully downloaded ${{ env.INSTALLER_FILE_NAME }}"
          echo "Successfully downloaded version ${{ needs.release-candidate.outputs.installer-version }}"
