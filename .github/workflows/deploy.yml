name: Promotional Deployment

on:
  workflow_dispatch:
    inputs:
      manualRunId:
          description: 'Run ID of the build to deploy (leave blank for latest)'
          required: false
          type: string
      isMandatoryUpdate:
        description: 'Is this a mandatory update?'
        required: true
        type: boolean
        default: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Determine Run ID
        id: select-run
        run: |
          # Check if the user provided a manual ID
          USER_INPUT="${{ github.event.inputs.manualRunId }}"
          
          if [ -n "$USER_INPUT" ]; then
            echo "Using manually provided Run ID: $USER_INPUT"
            echo "final_run_id=$USER_INPUT" >> $GITHUB_OUTPUT
          else
            echo "No Run ID provided. Fetching latest successful build..."
            RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow "build.yml" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            
            if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
              echo "Error: No successful build runs found!"
              exit 1
            fi
            
            echo "Found latest Run ID: $RUN_ID"
            echo "final_run_id=$RUN_ID" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-artifact
          run-id: ${{ steps.select-run.outputs.final_run_id }}
          github-token: ${{ github.token }}

      - name: Deploy
        run: |
          echo "Deploying Artifact from Run ID: ${{ steps.select-run.outputs.final_run_id }}"
          echo "Mandatory Update: ${{ inputs.isMandatoryUpdate }}"

  deploy-preprod:
    name: Deploy to Pre-Prod
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-artifact

      - name: Deploy
        run: echo "Deploying to Pre-Prod..."

  deploy-prod:
    name: Deploy to Production
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-artifact

      - name: Final Deploy
        run: |
          echo "Deploying to Production"
          if [ "${{ inputs.isMandatoryUpdate }}" = "true" ]; then
            echo "Executing high-priority migration scripts..."
          fi
