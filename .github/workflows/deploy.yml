name: Promotional Deployment

on:
  workflow_dispatch:
    inputs:
      isMandatoryUpdate:
        description: 'Is this a mandatory update?'
        required: true
        type: boolean
        default: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # No checkout needed for this option
      - name: Get Latest Build Run ID
        id: get-run-id
        run: |
          # We use the built-in variable GITHUB_REPOSITORY (e.g., "user/repo")
          RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow "build.yml" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "latest_run_id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Artifact from Build Workflow
        uses: actions/download-artifact@v4
        with:
          name: production-artifact
          # This tells the action to look at the Build run, not the current one
          run-id: ${{ steps.get-run-id.outputs.latest_run_id }}
          github-token: ${{ github.token }}

      - name: Deploy
        run: echo "Deploying artifact from run ${{ steps.get-run-id.outputs.latest_run_id }}"

  deploy-preprod:
    name: Deploy to Pre-Prod
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-artifact

      - name: Deploy
        run: echo "Deploying to Pre-Prod..."

  deploy-prod:
    name: Deploy to Production
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-artifact

      - name: Final Deploy
        run: |
          echo "Deploying to Production"
          if [ "${{ inputs.isMandatoryUpdate }}" = "true" ]; then
            echo "Executing high-priority migration scripts..."
          fi
